function render(){
 var data=activeDomain==='comm'?commCatalog:semiCatalog;
 var q=search.value.trim().toLowerCase(),visible=0,columns=[[],[]];
 data.forEach(function(group,i){
  var groupMatch=group.name.toLowerCase().indexOf(q)>-1;
  var matches=group.topics.map(function(item,j){
   var title=typeof item==='string'?item:item.title,detail=typeof item==='string'?'':item.detail;
   return {title:title,detail:detail,j:j,url:typeof item==='string'?'':(item.url||'')};

  if(q&&!groupMatch&&!matches.length)return;
